baseURL = 'https://example.org/'
languageCode = 'en-us'
#title = 'Nicolas Beltran-Velez"
theme = 'typo'
publishDir ="docs"

# Google analytics code
googleAnalytics = "G-xxxxxxxxx"

[taxonomies]
tag = 'tags'

[params]
# Meta description
description = "Nicolas Betran-Velez's notes and blog"

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = false

# Collection to display on home
#homeCollectionTitle = 'Posts'
#homeCollection = 'posts'

# Lists parameters
paginationSize = 100
listSummaries = false
listDateFormat = '2 Jan 2006'

# Breadcrumbs
breadcrumbs = false

# Social icons
[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/nicolas-beltran-velez-1950141a9/"

[[params.social]]
name = "github"
url = "https://github.com/velezbeltran"

# Main menu pages
[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "self-study"
url = "/self-study"

# Syntax highlight on code blocks
[markup]
defaultMarkdownHandler = "goldmark"
[markup.highlight]
style = 'algol'

[markup.goldmark]
[markup.goldmark.renderer]
    unsafe = true


# Giscus comments
[params.giscus]
enable = false
repo = "user/repo"
repoid = "repoId"
category = "General"
categoryid = "categoryId"
mapping = "pathname"
theme = "preferred_color_scheme"

